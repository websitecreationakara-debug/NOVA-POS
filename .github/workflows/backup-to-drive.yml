name: Backup orders to Google Drive

# Every day at 03:00 Phnom Penh time (20:00 UTC). Reads the orders, order lines and
# (optionally) customers straight from Supabase, zips them, and saves the zip into
# the shared Google Drive folder via the Apps Script web app -- see
# scripts/backup-to-drive.mjs and scripts/google-drive-backup.gs.
#
# It runs here, not inside the app: the app is on Cloudflare Workers, whose
# memory/CPU limits are too small to build a backup this size (error 1102).
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   GOOGLE_DRIVE_BACKUP_URL, GOOGLE_DRIVE_BACKUP_SECRET
# and, to include customer details, a repository VARIABLE (or secret)
#   BACKUP_INCLUDE_CUSTOMER = true
# "Run workflow" in the Actions tab triggers one by hand.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the backup script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/backup-to-drive.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_BACKUP_URL: ${{ secrets.GOOGLE_DRIVE_BACKUP_URL }}
          GOOGLE_DRIVE_BACKUP_SECRET: ${{ secrets.GOOGLE_DRIVE_BACKUP_SECRET }}
          BACKUP_INCLUDE_CUSTOMER: ${{ vars.BACKUP_INCLUDE_CUSTOMER || secrets.BACKUP_INCLUDE_CUSTOMER }}
        run: node scripts/backup-to-drive.mjs
